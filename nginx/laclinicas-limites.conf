# ==========================================================================
#  Zona do limitador de login — LA Clínicas
#  Instalada em /etc/nginx/conf.d/ pelo criar-site.sh, com __APP__ trocado.
#
#  Em conf.d, e não no bloco do site: a zona precisa existir antes de qualquer
#  `limit_req zone=...`, independente de qual bloco esteja ativo (o provisório
#  em HTTP ou o definitivo em HTTPS).
#
#  O NOME DA ZONA É GLOBAL no nginx, e este servidor hospeda vários sites:
#  dois arquivos declarando a mesma zona fazem o nginx recusar a configuração
#  INTEIRA — derrubando o reload de todos. Por isso o nome deriva do app.
#
#  12 tentativas por minuto por endereço: folgado para gente, apertado para
#  robô. A trava do próprio aplicativo (por IP E por conta) continua valendo.
# ==========================================================================
limit_req_zone $binary_remote_addr zone=__APP___login:10m rate=12r/m;
